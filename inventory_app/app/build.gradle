plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.promix.inventory'
    compileSdk 35

    defaultConfig {
        applicationId 'com.promix.inventory'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-firestore:25.1.1'
}
